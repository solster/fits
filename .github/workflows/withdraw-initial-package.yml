name: Restore initial package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the initial package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST orgs/solster/packages/nuget/Solster.Fits/restore
